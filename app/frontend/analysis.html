<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>数据分析 - 智能景区大数据平台</title>
  <link rel="stylesheet" href="static/css/main.css?v=20" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- 过滤栏 -->
    <div class="card" style="margin-bottom: 16px">
      <div class="form-row">
        <label>时间范围:</label>
        <input type="date" id="filter-start" value="2023-01-01" />
        <span>~</span>
        <input type="date" id="filter-end" value="2023-12-31" />
        <label>景点:</label>
        <select id="filter-attraction"><option value="">全部</option></select>
        <button class="btn btn-primary" id="btn-apply">应用</button>
        <button class="btn" id="btn-reset">重置</button>
      </div>
    </div>

    <!-- 日客流量 -->
    <div class="card">
      <div class="card-title">日客流量 / 日消费额</div>
      <div class="card-body" id="chart-daily" style="height: 320px"></div>
    </div>

    <!-- 维度分析 -->
    <div class="grid-2" style="margin-top: 16px">
      <div class="card">
        <div class="card-title">小时分布</div>
        <div class="card-body" id="chart-hourly" style="height: 280px"></div>
      </div>
      <div class="card">
        <div class="card-title">景点类型汇总</div>
        <div class="card-body" id="chart-type" style="height: 280px"></div>
      </div>
    </div>

    <div class="grid-2" style="margin-top: 16px">
      <div class="card">
        <div class="card-title">地区分布 TOP 20</div>
        <div class="card-body" id="chart-region" style="height: 300px"></div>
      </div>
      <div class="card">
        <div class="card-title">年龄 × 性别</div>
        <div class="card-body" id="chart-age" style="height: 300px"></div>
      </div>
    </div>

    <!-- 关联规则 -->
    <div class="card" style="margin-top: 16px">
      <div class="card-title">
        关联规则 TOP 20
        <span class="subtitle">FPGrowth · minSupport=0.02 · minConfidence=0.3</span>
      </div>
      <div class="card-body" id="table-fpgrowth" style="max-height: 400px; overflow-y: auto"></div>
    </div>
  </div>

  <script src="static/js/common.js?v=2"></script>
  <script src="static/js/api.js?v=2"></script>
  <script src="static/js/analysis.js?v=2"></script>
</body>
</html>
