<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>业务管理 - 智能景区大数据平台</title>
  <link rel="stylesheet" href="static/css/main.css?v=21" />
  <style>
    .flow-diagram {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 8px;
      background: #0a0e27;
      border-radius: 6px;
      margin: 12px 0;
    }
    .flow-node {
      background: linear-gradient(135deg, #131a3a, #1a2350);
      border: 1px solid #2a3b6e;
      border-radius: 6px;
      padding: 12px 16px;
      text-align: center;
      min-width: 110px;
    }
    .flow-node-icon { font-size: 22px; }
    .flow-node-label { font-size: 12px; color: #b0c4de; margin-top: 4px; }
    .flow-arrow {
      color: #00d4ff;
      font-size: 18px;
      margin: 0 4px;
    }
    .realtime-event {
      padding: 6px 10px;
      background: #0a0e27;
      border-left: 3px solid #00d4ff;
      margin: 4px 0;
      border-radius: 0 4px 4px 0;
      font-size: 12px;
      color: #b0c4de;
      font-family: 'Consolas', 'Monaco', monospace;
    }
    .realtime-event .ts { color: #9ca3af; margin-right: 6px; }
    .realtime-event .tag { color: #00d4ff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" style="margin-bottom: 16px">
      <div class="form-row" id="tab-bar">
        <button class="btn btn-primary" data-tab="attractions">景点</button>
        <button class="btn" data-tab="visitors">游客</button>
        <button class="btn" data-tab="consumption">消费</button>
        <button class="btn" data-tab="visits">游玩</button>
        <button class="btn" data-tab="system">系统管理</button>
      </div>
      <p class="text-muted" style="font-size:12px; margin-top:8px">
        💡 实时数据流 (Kafka → HBase) 已在 <a href="realtime.html" style="color:#00d4ff">实时流监控</a> 页面
      </p>
    </div>

    <!-- 景点 -->
    <div id="tab-attractions" class="tab-content">
      <div class="card">
        <div class="card-title">景点列表</div>
        <div class="card-body" id="table-attractions"></div>
      </div>
    </div>

    <!-- 游客 -->
    <div id="tab-visitors" class="tab-content" style="display:none">
      <div class="card">
        <div class="card-title">游客列表</div>
        <div class="form-row">
          <label>性别:</label>
          <select id="v-gender"><option value="">全部</option><option>男</option><option>女</option></select>
          <label>年龄:</label>
          <input type="number" id="v-min-age" placeholder="最小" style="width:80px" />
          <span>~</span>
          <input type="number" id="v-max-age" placeholder="最大" style="width:80px" />
          <button class="btn btn-primary" id="v-search">查询</button>
        </div>
        <div class="card-body" id="table-visitors"></div>
        <div class="pagination" id="pagination-visitors"></div>
      </div>
    </div>

    <!-- 消费 -->
    <div id="tab-consumption" class="tab-content" style="display:none">
      <div class="card">
        <div class="card-title">消费记录</div>
        <div class="form-row">
          <label>开始日期:</label>
          <input type="date" id="c-start" />
          <label>结束日期:</label>
          <input type="date" id="c-end" />
          <label>游客ID:</label>
          <input type="number" id="c-visitor-id" style="width:100px" />
          <label>景点ID:</label>
          <input type="number" id="c-attraction-id" style="width:80px" />
          <button class="btn btn-primary" id="c-search">查询</button>
        </div>
        <div class="card-body" id="table-consumption"></div>
        <div class="pagination" id="pagination-consumption"></div>
      </div>
    </div>

    <!-- 游玩 -->
    <div id="tab-visits" class="tab-content" style="display:none">
      <div class="card">
        <div class="card-title">游玩记录</div>
        <div class="form-row">
          <label>开始日期:</label>
          <input type="date" id="vr-start" />
          <label>结束日期:</label>
          <input type="date" id="vr-end" />
          <label>游客ID:</label>
          <input type="number" id="vr-visitor-id" style="width:100px" />
          <label>景点ID:</label>
          <input type="number" id="vr-attraction-id" style="width:80px" />
          <button class="btn btn-primary" id="vr-search">查询</button>
        </div>
        <div class="card-body" id="table-visits"></div>
        <div class="pagination" id="pagination-visits"></div>
      </div>
    </div>

    <!-- 实时流已迁移到 realtime.html -->

    <!-- 系统管理 -->
    <div id="tab-system" class="tab-content" style="display:none">
      <div class="card">
        <div class="card-title">系统总览</div>
        <div class="card-body" id="sys-overview">加载中...</div>
      </div>

      <div class="card">
        <div class="card-title">17 个容器状态</div>
        <div class="card-body" id="sys-containers">加载中...</div>
      </div>

      <div class="card">
        <div class="card-title">已训练模型 (PySpark MLlib)</div>
        <div class="card-body" id="sys-models">加载中...</div>
      </div>

      <div class="card">
        <div class="card-title">数据集状态</div>
        <div class="card-body" id="sys-datasets">加载中...</div>
      </div>

      <div class="card">
        <div class="card-title">HDFS 分区目录</div>
        <div class="card-body" id="sys-hdfs">加载中...</div>
      </div>

      <div class="card">
        <div class="card-title">操作按钮</div>
        <div class="card-body">
          <p>单步操作（异步，下方"异步任务"区域查看进度）：</p>
          <div class="form-row" style="flex-wrap:wrap; gap:8px">
            <button class="btn btn-primary" onclick="triggerAction('load_csv')">加载 CSV 到 MySQL</button>
            <button class="btn btn-primary" onclick="triggerAction('sqoop')">Sqoop 导入 HDFS</button>
            <button class="btn btn-primary" onclick="triggerAction('spark_clean')">Spark 清洗</button>
            <button class="btn btn-primary" onclick="triggerAction('hive_ddl')">Hive DDL + 视图</button>
            <button class="btn btn-primary" onclick="triggerAction('hive_queries')">Hive 复杂查询</button>
            <button class="btn btn-primary" onclick="triggerAction('spark_train')">PySpark 训练</button>
            <button class="btn" style="background:#10b981; color:#fff; margin-left:20px" onclick="triggerPipeline()">⚡ 一键初始化</button>
          </div>
          <p style="color:#9ca3af; font-size:12px; margin-top:8px">一键初始化 = load_csv → sqoop → spark_clean → hive_ddl → spark_train (约 5-10 分钟)</p>
        </div>
      </div>

      <div class="card">
        <div class="card-title">异步任务 (最近 20 个)</div>
        <div class="card-body" id="sys-jobs">加载中...</div>
      </div>
    </div>

  </div>

  <script src="static/js/common.js?v=21"></script>
  <script src="static/js/api.js?v=21"></script>
  <script src="static/js/manage.js?v=21"></script>
  <script src="static/js/admin.js?v=21"></script>
</body>
</html>
