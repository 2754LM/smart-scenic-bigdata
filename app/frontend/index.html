<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>总览大屏 - 智能景区大数据平台</title>
  <link rel="stylesheet" href="static/css/main.css?v=21" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- KPI 卡片 (8 基础 + 2 ML 预测) -->
    <div class="kpi-grid" id="kpi-grid">
      <div class="kpi"><div class="label">游客总数</div><div class="value" id="kpi-visitors">--</div></div>
      <div class="kpi kpi-1"><div class="label">景点总数</div><div class="value" id="kpi-attractions">--</div></div>
      <div class="kpi kpi-2"><div class="label">消费总额</div><div class="value" id="kpi-consume-total">--</div></div>
      <div class="kpi kpi-3"><div class="label">游玩总次数</div><div class="value" id="kpi-visits">--</div></div>
      <div class="kpi kpi-4"><div class="label">平均消费</div><div class="value" id="kpi-avg-consume">--</div></div>
      <div class="kpi kpi-1"><div class="label">平均游玩时长</div><div class="value" id="kpi-avg-duration">--</div></div>
      <div class="kpi kpi-2"><div class="label">消费笔数</div><div class="value" id="kpi-consume-count">--</div></div>
      <div class="kpi kpi-3"><div class="label">日均游客</div><div class="value" id="kpi-daily-avg">--</div></div>
    </div>

    <!-- ML 预测 KPI -->
    <div class="kpi-grid" style="margin-top: 14px">
      <div class="kpi" style="background: linear-gradient(135deg, #131a3a 0%, #1a2350 100%); border: 1px solid #00d4ff">
        <div class="label" style="color:#00d4ff">📈 昨日实际游客</div>
        <div class="value" id="kpi-yesterday">--</div>
        <div class="label" style="font-size: 11px; margin-top: 4px">来源: visit_records</div>
      </div>
      <div class="kpi kpi-1" style="background: linear-gradient(135deg, #131a3a 0%, #1a2350 100%); border: 1px solid #a855f7">
        <div class="label" style="color:#c084fc">🤖 预测明日游客</div>
        <div class="value" id="kpi-tomorrow">--</div>
        <div class="label" style="font-size: 11px; margin-top: 4px">基于历史 30 天 + 星期因子</div>
      </div>
      <div class="kpi kpi-2" style="background: linear-gradient(135deg, #131a3a 0%, #1a2350 100%); border: 1px solid #10b981">
        <div class="label" style="color:#10b981">📊 变化趋势</div>
        <div class="value" id="kpi-change">--</div>
        <div class="label" style="font-size: 11px; margin-top: 4px">明日 vs 昨日</div>
      </div>
      <div class="kpi kpi-3" style="background: linear-gradient(135deg, #131a3a 0%, #1a2350 100%); border: 1px solid #f59e0b">
        <div class="label" style="color:#f59e0b">🏆 最热门景点 (明日)</div>
        <div class="value" id="kpi-top" style="font-size: 22px">--</div>
        <div class="label" style="font-size: 11px; margin-top: 4px">预测客流量最高</div>
      </div>
    </div>

    <!-- 时序图 -->
    <div class="grid-2">
      <div class="card">
        <div class="card-title">日游客趋势 <span class="subtitle">2023-01-01 ~ 2023-12-31</span></div>
        <div class="card-body" id="chart-visitor-trend" style="height: 280px"></div>
      </div>
      <div class="card">
        <div class="card-title">日消费趋势 <span class="subtitle">单位: 元</span></div>
        <div class="card-body" id="chart-consume-trend" style="height: 280px"></div>
      </div>
    </div>

    <!-- 中部 3 图表 -->
    <div class="grid-3">
      <div class="card">
        <div class="card-title">景点热度 TOP 10</div>
        <div class="card-body" id="chart-attraction-rank" style="height: 300px"></div>
      </div>
      <div class="card">
        <div class="card-title">24h 时段分布</div>
        <div class="card-body" id="chart-hourly" style="height: 300px"></div>
      </div>
      <div class="card">
        <div class="card-title">游客年龄×性别</div>
        <div class="card-body" id="chart-age-gender" style="height: 300px"></div>
      </div>
    </div>

    <!-- 底部 -->
    <div class="grid-2">
      <div class="card">
        <div class="card-title">地区分布 TOP 20</div>
        <div class="card-body" id="chart-region" style="height: 280px"></div>
      </div>
      <div class="card">
        <div class="card-title">景点类型汇总</div>
        <div class="card-body" id="chart-type-summary" style="height: 280px"></div>
      </div>
    </div>
  </div>

  <script src="static/js/common.js?v=21"></script>
  <script src="static/js/api.js?v=21"></script>
  <script src="static/js/index.js?v=21"></script>
</body>
</html>
